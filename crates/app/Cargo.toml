[package]
name = "mark-app"
description = "Mark. Sign anything. Desktop document signer."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "mark"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
gpui-omarchy.workspace = true
mark-core.workspace = true
mark-export.workspace = true
mark-image.workspace = true
mark-pdf.workspace = true
platform.workspace = true
image.workspace = true
# StreamExt over the export worker's progress channel (already in the
# dependency tree via gpui; no new external code).
futures = "0.3"
# Structured logging (plan.md §17): counts and durations, never contents.
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
# Same source and version as the normal dependency (test doc rule), with
# the headless UI-testing helpers enabled (plan.md §20.4).
gpui-kit = { version = "=0.7.0", default-features = false, features = ["assets", "test-support"] }
# Export verification in UI tests reloads the written file through the
# direct binding (plan.md §20.3); same pin as mark-pdf.
pdfium-render = "0.9"
tempfile = "3"
