name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: ubuntu (fmt, clippy, check, test — full workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # GPUI Linux backend links xkbcommon, wayland (client + egl), EGL and
      # fontconfig (text stack) via pkg-config at build time
      # (plan.md §20.5: ubuntu runs the full suite).
      - name: Install GPUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libwayland-dev libegl1-mesa-dev libgles2-mesa-dev libfontconfig1-dev

      - uses: Swatinem/rust-cache@v2

      # Real PDFium runtime: mark-pdf integration tests bind to it on
      # every platform (tests still skip gracefully where it is absent).
      - name: Fetch PDFium runtime
        run: ./script/fetch-pdfium.sh

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace --all-targets

  # Phase 11 (plan.md §19.2, §20.5): the full workspace — including the
  # UI and platform crates — compiles and tests on every platform, with
  # the real PDFium runtime fetched per OS so mark-pdf integration tests
  # bind it everywhere instead of skipping.
  cross-platform:
    name: ${{ matrix.os }} (full workspace check + test, PDFium bound)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # bash + curl + tar exist on all three runner images (Git bash on
      # Windows); the script detects the platform and fetches the matching
      # runtime (dylib on macOS, dll on Windows).
      - name: Fetch PDFium runtime
        shell: bash
        run: ./script/fetch-pdfium.sh

      # Proof the runtime actually bound: a green test suite alone can't
      # show it (tests skip gracefully without a runtime — that path is
      # exactly what this step rules out on Windows, whose archive keeps
      # pdfium.dll under bin/, not lib/).
      - name: Verify PDFium binding
        shell: bash
        run: cargo run -p mark-pdf --example check_bind

      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace --all-targets
