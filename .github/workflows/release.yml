name: Release

# Release packaging (plan.md §19.3): release builds + the PDFium runtime
# distributed next to the executable on every platform, published as a
# GitHub release on tags. workflow_dispatch allows testing the pipeline
# without cutting a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: ${{ matrix.os }} (package + verify bundled runtime)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # GPUI Linux backend links xkbcommon, wayland (client + egl), EGL
      # and fontconfig via pkg-config at build time.
      - name: Install GPUI system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libwayland-dev libegl1-mesa-dev libgles2-mesa-dev libfontconfig1-dev

      - uses: Swatinem/rust-cache@v2

      - name: Fetch PDFium runtime
        shell: bash
        run: ./script/fetch-pdfium.sh

      # Builds the release binary, stages it with the runtime beside it,
      # and verifies --check-pdfium against the *bundled* library with the
      # dev vendor tree hidden (§19.3's explicit bundling test).
      - name: Package and verify
        shell: bash
        run: ./script/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-artifact
          path: dist/*

      - name: Upload to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes --title "Mark ${TAG#v}"
          gh release upload "$TAG" dist/* --clobber
